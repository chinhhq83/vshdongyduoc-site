<body>
 <header>
  <div class="header-left">
    <h1>Viện Sinh Hóa Đông Y Dược</h1>
    <p>Tinh Hoa Cổ Truyền - Khoa Học Kiểm Chứng</p>
  </div>
  <div class="header-center">
    <img src="images/logo.png" alt="Logo Viện Sinh Hóa Đông Y Dược" />

  <nav class="header-right">
    <a href="index.html">Trang chủ</a>

    <a href="lien-he.html">Liên hệ</a>
  </nav>
</header>

<main class="container">
  <h1>Đăng ký thử nghiệm</h1>
  <form action="https://formsubmit.co/vs.hd@vshdongyduoc.org" method="POST">
    <!-- Bảo mật và tuỳ chọn -->
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="box">
    <input type="hidden" name="_subject" value="Thông điệp từ website vshdongyduoc.org">
    <input type="hidden" name="_next" value="https://vshdongyduoc.org/thank-you.html">

    <label for="name">Họ và tên:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Số điện thoại:</label>
    <input type="tel" id="phone" name="phone" pattern="[0-9+()\- ]{9,15}" required placeholder="VD: +84901234567" />


    <label for="project">Chọn dự án thử nghiệm:</label>
    <select id="project" name="project" required>
      <option value="">-- Chọn dự án --</option>
      <option value="du-an-1">Dự án nghiên cứu Đông trùng hạ thảo</option>
      <option value="du-an-2">Dự án điều trị tiểu đường</option>
      <option value="du-an-3">Dự án hỗ trợ gan nhiễm mỡ</option>
      <option value="du-an-4">Dự án công nghệ sinh học</option>
    </select>

    <label for="message">Nội dung:</label>
    <textarea id="message" name="message" rows="5" required></textarea>

    <button type="submit">Gửi liên hệ</button>
  </form>
<script>
    document.querySelector('form').addEventListener('submit', function(event) {
      const phone = document.getElementById('phone').value.trim();
      const phonePattern = /^[0-9+()\- ]{9,15}$/;
      if (!phonePattern.test(phone)) {
        alert('Số điện thoại không hợp lệ. Vui lòng nhập đúng định dạng.');
        event.preventDefault();
      }
    });
  </script>
</main>
