/* ================================================
   🌟 UNIFIED LAYOUT FOR IMAGE-BASED GAMES
   (Game 1 – Word Hunt – Matching)
   ================================================ */

.songngu-container .game1-wrapper,
.songngu-container .wordhunt-container,
.matching-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(140px, 1fr));
  justify-items: center;
  align-items: start;
  gap: clamp(10px, 3vw, 16px);
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
  padding: 0 10px;
  box-sizing: border-box;
  text-align: center;
}

/* === CARD STYLE cho Game1, WordHunt, Matching === */
.image-card,
.wordhunt-card,
.game1-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(6px, 2vw, 10px);
  padding: clamp(6px, 2vw, 10px);
  text-align: center;
  width: 100%;
  background: #fff;
  border-radius: 12px;
  border: 1px solid #e0e0e0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  max-width: 180px;
}

/* === IMAGE (đồng bộ 100%) === */
.songngu-container .game1-wrapper img,
.songngu-container .wordhunt-container img,
.matching-grid img,
.game1-img {
  width: 100%;
  max-width: 160px;
  height: 150px;
  border-radius: 12px;
  border: 2px solid #ccc;
  object-fit: cover;
  display: block;
  margin: 0 auto;
}

/* === DROP ZONE / LABEL – đồng bộ giữa 3 game === */
.drop-zone,
.image-dropzone {
  margin: clamp(5px, 2vw, 8px) auto;
  width: clamp(120px, 45vw, 160px);
  height: clamp(35px, 10vw, 50px);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  font-size: clamp(14px, 4vw, 18px);
  font-weight: bold;
  color: #333;
  text-align: center;
}

/* === DRAGGABLE WORD (Game1 & Matching pool) === */
.draggable,
.pool-word {
  padding: clamp(8px, 2vw, 10px) clamp(12px, 4vw, 20px);
  border: 2px solid #00bfa5;
  border-radius: 10px;
  font-size: clamp(16px, 5vw, 22px);
  font-weight: bold;
  cursor: grab;
  background: #00e676;
  color: #fff;
  user-select: none;
  text-align: center;
  transition: transform 0.2s ease;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

/* === MATCHING POOL (luôn nằm ngang) === */
.matching-pool {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap; /* ✅ Cho phép xuống hàng nếu tràn */
  gap: clamp(6px, 2vw, 10px);
  padding: clamp(6px, 1.5vw, 10px);
  background: rgba(33,150,243,0.05);
  border-radius: 15px;
  border: 2px dashed #BBDEFB;
  margin: 10px auto;
  max-width: 380px;
  width: 95%;
  box-sizing: border-box;
}



/* === LABEL TRONG WORD HUNT === */
.wordhunt-label {
  font-weight: bold;
  font-size: clamp(14px, 4vw, 18px);
  color: #333;
  text-align: center;
}

/* === COMMON HOVER / STATE EFFECTS === */
.draggable:hover,
.pool-word:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

.draggable:active,
.pool-word:active {
  cursor: grabbing;
  transform: translateY(0);
}

.draggable.matched,
.pool-word.matched {
  background: #90caf9;
  cursor: default;
  opacity: 0.7;
  transform: none;
  box-shadow: none;
}

.draggable.selected,
.pool-word.selected {
  border: 3px solid orange;
}

/* === CARD STATES (correct / wrong / listening) === */
.wordhunt-card.wordhunt-correct,
.image-card.correct-card,
.game1-card.correct-card {
  border-color: #4caf50;
  transform: scale(1.05);
}

.wordhunt-card.wordhunt-listening,
.image-card.listening-card,
.game1-card.listening-card {
  border-color: #ff9800;
}

.wordhunt-card.wordhunt-wrong,
.image-card.wrong-card,
.game1-card.wrong-card {
  border-color: #f44336;
  animation: shake 0.4s;
}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-5px); }
  40%,80% { transform: translateX(5px); }
}

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/song-ngu-cho-be/service-worker.js')
    .then(reg => console.log('SW registered:', reg.scope))
    .catch(err => console.error('SW registration failed:', err));
}


// Mode selection functionality
document.addEventListener('DOMContentLoaded', function() {
    const modeButtons = document.querySelectorAll('.mode-btn');
    
    modeButtons.forEach(button => {
        button.addEventListener('click', function() {
            const screen = this.closest('.screen');
            const mode = this.dataset.mode;
            
            // Update active button
            screen.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            this.classList.add('active');
            
            // Show/hide appropriate select element
            const topicSelect = screen.querySelector('#topicSelect');
            const alphabetSelect = screen.querySelector('#alphabetSelect');
            
            if (mode === 'topic') {
                topicSelect.style.display = 'block';
                alphabetSelect.style.display = 'none';
            } else if (mode === 'alphabet') {
                topicSelect.style.display = 'none';
                alphabetSelect.style.display = 'block';
            }
            
            // Clear current content
            screen.querySelector('#word').textContent = '';
            screen.querySelector('#transcriptBox').textContent = '';
            screen.querySelector('#wordImage').src = '/song-ngu-cho-be/images/icon-512.png';
            screen.querySelector('#gameArea').style.display = 'none';
            screen.querySelector('#listenBtn').style.display = 'none';
            screen.querySelector('#speakBtn').style.display = 'none';
            screen.querySelector('#gameBtn').style.display = 'none';
            
            // Reset feedback
            screen.querySelector('#feedback').textContent = '';
            screen.querySelector('#error').textContent = '';
        });
    });
});



/* === CODE CÀI APP (đóng gói an toàn) === */
(() => {
  let deferredPrompt;

  const installBox = document.getElementById('installAppBox');
  const installBtn = document.getElementById('installAppBtn');
  const guideBtn = document.getElementById('installGuideBtn');

  if (!installBox || !installBtn || !guideBtn) {
    console.warn('[PWA] Install UI elements not found');
    return;
  }

  window.addEventListener('load', () => {
    if (!isRunningStandalone()) {
      installBox.style.display = 'block';
    }
  });

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('[PWA] beforeinstallprompt captured');
  });

  installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBox.style.display = 'none';
    } else {
      showManualGuide();
    }
  });

  guideBtn.addEventListener('click', showManualGuide);

  function isIOS() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
  }

  function isRunningStandalone() {
    return (
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true
    );
  }

  function showManualGuide() {
    if (isIOS()) {
      alert(
`📱 CÀI ỨNG DỤNG TRÊN IPHONE

1️⃣ Mở bằng Safari
2️⃣ Bấm nút Chia sẻ (⬆️)
3️⃣ Chọn Add to Home Screen
4️⃣ Bấm Add

👉 Bé mở app từ màn hình chính`
      );
    } else {
      alert(
`📲 CÀI ỨNG DỤNG

1️⃣ Nhìn thanh địa chỉ
2️⃣ Bấm biểu tượng 📲
3️⃣ Chọn Cài đặt

👉 Bé mở app như ứng dụng thường`
      );
    }
  }
})();
